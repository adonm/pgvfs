[package]
name = "pgvfs"
version = "0.2.0"
edition = "2021"
description = "DuckDB pgvfs:// filesystem: DuckLake data files as PostgreSQL rows"
license = "Apache-2.0"
repository = "https://github.com/adonm/pgvfs"

[lib]
# rlib for the contract tests; staticlib for the DuckDB extension (extension/).
crate-type = ["rlib", "staticlib"]

[dependencies]
anyhow = "1"
bytes = "1"
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No mmap (pgvfs is the storage) and no zstd (a C build on every platform).
tantivy = { version = "0.26", default-features = false, features = ["lz4-compression", "stemmer", "stopwords"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14", default-features = false }

# The staticlib keeps its symbols; extension/build.sh strips the final
# extension after linking.
[profile.release]
lto = "fat"
codegen-units = 1
