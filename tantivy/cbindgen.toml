# The tantivy C header (extension/src/include/tantivy.h) from the FFI in
# src/lib.rs. tests/headers.rs fails when it differs;
# UPDATE_HEADERS=1 cargo test regenerates.
language = "C"
header = "/* C ABI of the tantivy Rust crate (tantivy/src/lib.rs); generated by cbindgen, do not edit. */"
include_guard = "TANTIVY_H"
cpp_compat = true
style = "type"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
documentation_style = "c"
tab_width = 4

[export.rename]
"Build" = "TantivyBuild"
"Split" = "TantivySplit"
"ReadCb" = "tantivy_read_cb"
"WriteCb" = "tantivy_write_cb"
"HitCb" = "tantivy_hit_cb"
