name: Weekly

# Build and test the extension for the stable DuckDB release and the newest
# 2.0 dev wheel, publish both as pre-releases (the build store), record the
# Houston benchmark, then redeploy Pages (pages.yml). Weekly keeps
# Actions use low; run it by hand after a change worth publishing.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# `bash` runs steps with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: PG_IMAGE=postgres:11 just contract

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [release, nightly]
    # A DuckDB nightly break must not stop the stable build publishing.
    continue-on-error: ${{ matrix.target == 'nightly' }}
    env:
      GH_TOKEN: ${{ github.token }}  # reads DuckDB's CI artifacts (nightly libs)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags, for the extension version (git describe)
      - uses: jdx/mise-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: just e2e ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ext-${{ matrix.target }}
          path: target/ext/${{ matrix.target }}/

  bench:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: ext-release
          path: target/ext/release
      # Overture Houston (1M rows): cold, warm and new-area passes in minutes.
      - run: bash scripts/bench.sh city --passes 4 | tee bench.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.jsonl

  publish:
    needs: [compat, build, bench]
    if: ${{ !cancelled() && needs.compat.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # releases are the build store
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          for target in release nightly; do
            bash scripts/release.sh publish "artifacts/ext-$target"
          done
          if [ -f artifacts/bench/bench.jsonl ]; then
            bash scripts/release.sh bench artifacts/bench/bench.jsonl
          fi
          bash scripts/release.sh prune

  pages:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
