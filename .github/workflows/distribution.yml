name: Distribution

# Builds and tests the extension for every platform with DuckDB's own
# extension pipeline: the same one DuckDB's community-extensions repository
# runs, so a green run here means the community build will work. It compiles
# DuckDB for five platforms (~25 min), so it runs on tags, weekly and by hand.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: pgvfs
      extra_toolchains: rust
      # No sockets in WebAssembly; MinGW and musl are not supported targets.
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;windows_amd64_rtools;linux_amd64_musl;linux_arm64_musl"
