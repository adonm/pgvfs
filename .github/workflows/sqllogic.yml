name: pgdb

# DuckDB's own SQL tests (test/sql, about 3,400 files), each on a pgdb://
# database (test/configs/pgvfs.json, `just sqllogic`), and the storage contract
# on the oldest PostgreSQL versions. Too long for every push: weekly, by hand,
# and on pull requests that touch pgdb://.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - dbschema.sql
      - src/db.rs
      - extension/src/pgdb_filesystem.cpp
      - test/configs/**
      - .github/workflows/sqllogic.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The contract (pgvfs:// and pgdb://) without an extension: no DuckDB build.
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [11, 14]
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: PG_IMAGE=postgres:${{ matrix.pg }} just contract

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: jdx/mise-action@v3
      # Shared with ci.yml: DuckDB compiles once per commit.
      - uses: actions/cache@v4
        with:
          path: build/release
          key: build-release-${{ github.sha }}
          restore-keys: build-release-
      - run: just ext && ninja -C build/release unittest
      - uses: actions/upload-artifact@v4
        with:
          name: unittest
          path: build/release/test/unittest
          retention-days: 3

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # DuckDB's test files
      - uses: jdx/mise-action@v3
      - uses: actions/download-artifact@v4
        with:
          name: unittest
          path: build/release/test
      - run: chmod +x build/release/test/unittest
      - run: SHARD=${{ matrix.shard }} SHARDS=4 just sqllogic test/sql 4
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sqllogic-logs-${{ matrix.shard }}
          path: .tmp/sqllogic/
          retention-days: 14
