name: CI

# Per change: the cheap checks and the stable build. The DuckDB nightly, the
# oldest PostgreSQL, publishing and the benchmark run weekly (weekly.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `bash` runs steps with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: just check

  # Permissive licences only, crates.io only (deny.toml). RustSec advisories are
  # checked weekly (weekly.yml): a new advisory is not a reason to fail a change.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive  # the stable build compiles the duckdb submodule
      - uses: jdx/mise-action@v3
      # DuckDB compiles once per commit (about 7 minutes); an older cache is the fallback.
      - uses: actions/cache@v4
        with:
          path: build/release
          key: build-release-${{ github.sha }}
          restore-keys: build-release-
      # The stable build, then the contract on PostgreSQL 18 and DuckDB end-to-end.
      - run: just e2e release
