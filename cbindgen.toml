# The pgvfs C header (extension/src/include/pgvfs.h) from the FFI in src/lib.rs.
# tests/headers.rs fails when it differs; UPDATE_HEADERS=1 cargo test regenerates.
language = "C"
header = "/* C ABI of the pgvfs Rust staticlib (src/lib.rs); generated by cbindgen, do not edit. */"
include_guard = "PGVFS_H"
cpp_compat = true
style = "type"
usize_is_size_t = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
documentation_style = "c"
tab_width = 4

[export]
# Internal constants of the crate, not part of the C ABI.
exclude = ["LAYOUT_VERSION", "ROW_BYTES", "WRITE_BATCH"]

[export.rename]
"ListCb" = "pgvfs_list_cb"
